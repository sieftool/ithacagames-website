<style>
:root{
  /* Layout: one carved walnut plaque, centred on a dark lacquered ground, carrying the studio mark and where to find it meanwhile. */
  --ink:#120e0c;
  --walnut:#22150f;
  --parchment:#f1e6d0;
  --dust:#bfae93;
  --gold:#e0b25a;
  --coral:#ea543a;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Gill Sans MT","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--parchment);font:400 1.125rem/1.6 var(--body);display:grid;place-items:center;padding:clamp(20px,5vw,64px) clamp(16px,4vw,40px)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 55% at 50% 42%,rgba(224,178,90,.2),transparent 72%);animation:breathe 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes breathe{from{opacity:.5}to{opacity:1}}
img{max-width:100%;height:auto;display:block}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.plaque{--bw:clamp(44px,9vw,104px);position:relative;width:min(100%,820px);border:var(--bw) solid var(--walnut);border-image:url(images/panel.jpg) 28% fill stretch;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.inner{margin:calc(var(--bw) * -.3) calc(var(--bw) * -.42);display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.logo{width:clamp(120px,22vw,168px)}
.eyebrow{font:700 .8rem/1.2 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1{margin:0}
.lede{max-width:28em;font-size:1.22rem;line-height:1.5;color:#e6dac3}
.lede strong{font-weight:500;color:var(--parchment)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:1em 1.5em;font:700 .84rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:1px solid transparent;border-radius:2px;transition:transform .2s,background-color .2s,border-color .2s}
.btn-primary{background:var(--coral);color:var(--ink)}
.btn-primary:hover{background:#ff6f55;transform:translateY(-2px)}
.btn-ghost{border-color:rgba(224,178,90,.6);color:var(--parchment)}
.btn-ghost:hover{border-color:var(--gold);background:rgba(224,178,90,.1)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin:10px 0 0;padding:16px 0 0;list-style:none;border-top:1px solid rgba(224,178,90,.28);font-size:1rem}
.links a{color:var(--parchment);text-decoration:none;border-bottom:1px solid rgba(224,178,90,.35)}
.links a:hover{border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<main class="plaque">
  <div class="inner">
    <h1><img class="logo" src="images/ithaca-logo.png" width="396" height="445" alt="Ithaca Games"></h1>
    <p class="eyebrow">Board game studio</p>
    <p class="lede">Our new website is coming soon. Until then, follow our debut game, <strong>Assertion: The Three Kingdoms</strong>, on Gamefound.</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://gamefound.com/en/projects/ithaca-board-games/assertion-the-three-kingdoms" rel="noopener">Follow on Gamefound</a>
      <a class="btn btn-ghost" href="https://www.youtube.com/watch?v=EL9j1pClkqw" rel="noopener">Watch the trailer</a>
    </div>
    <ul class="links">
      <li><a href="mailto:info@ithacagames.com">info@ithacagames.com</a></li>
      <li><a href="https://discord.gg/Nz86ueANm" rel="noopener">Discord</a></li>
      <li><a href="https://www.instagram.com/ithaca_games/" rel="noopener">Instagram</a></li>
      <li><a href="https://www.facebook.com/ithacagames" rel="noopener">Facebook</a></li>
    </ul>
  </div>
</main>
</body>
